name: SHIslandJake
version: '${project.version}'
main: org.Cry_Legende.sHIslandJake.SHIslandJake
api-version: '1.21'
author: Cry_Legende
description: Jake, le PNJ de chaque île SuperiorSkyblock2, qui parle et réagit à ce que fait le joueur.
depend:
  - SuperiorSkyblock2
  - FancyNpcs
  - packetevents
softdepend:
  - BlockDisplayCreator
  - HeadDatabase
  - PlaceholderAPI

commands:
  jake:
    description: Jake, le PNJ de votre île, et ses réglages.
    usage: /<command> [reglages|deplacer|visibilite|type|discret]
    aliases:
      - jack
      - islandnpc
      - isnpc
  shislandjake:
    description: Administration de SHIslandJake.
    usage: /<command> <reload|info|delete|import|stats|react|say>

permissions:
  shislandjake.use:
    description: Ouvrir Jake et ses réglages (/jake, /is jake), choisir son apparence, rendre Jake discret.
    default: true
  shislandjake.deplacer:
    description: Déplacer Jake sur son île (/jake deplacer).
    default: true
  shislandjake.visibilite:
    description: Cacher ou montrer Jake (/jake visibilite).
    default: true
  shislandjake.type.*:
    description: Toutes les apparences de Jake de la configuration par défaut.
    default: op
    children:
      shislandjake.type.villager: true
      shislandjake.type.evoker: true
      shislandjake.type.pillager: true
      shislandjake.type.vindicator: true
      shislandjake.type.wandering_trader: true
      shislandjake.type.witch: true
  shislandjake.type.villager:
    description: Jake en villageois.
    default: op
  shislandjake.type.evoker:
    description: Jake en évocateur.
    default: op
  shislandjake.type.pillager:
    description: Jake en pillard.
    default: op
  shislandjake.type.vindicator:
    description: Jake en vindicateur.
    default: op
  shislandjake.type.wandering_trader:
    description: Jake en marchand ambulant.
    default: op
  shislandjake.type.witch:
    description: Jake en sorcière (Jakie).
    default: op
  shislandjake.personnages:
    description: Utiliser les apparences obtenues (droit d'usage proposé pour apparences.permission-usage, grades VIP).
    default: op
  shislandjake.bypass:
    description: Cliquer sur le Jake de n'importe quelle île.
    default: op
  shislandjake.admin:
    description: Toutes les sous-commandes de /shislandjake.
    default: op
    children:
      shislandjake.admin.reload: true
      shislandjake.admin.info: true
      shislandjake.admin.delete: true
      shislandjake.admin.import: true
      shislandjake.admin.stats: true
      shislandjake.admin.react: true
      shislandjake.admin.say: true
      shislandjake.bypass: true
      shislandjake.type.*: true
      shislandjake.personnages: true
  shislandjake.admin.reload:
    description: Recharger config.yml (réactions comprises) et messages.yml (/shislandjake reload).
    default: op
  shislandjake.admin.info:
    description: Nombre de Jake, ou le Jake de l'île d'un joueur (/shislandjake info [joueur]).
    default: op
  shislandjake.admin.delete:
    description: Retirer le Jake d'une île ; il revient à sa place de départ au prochain /jake (/shislandjake delete [joueur]).
    default: op
  shislandjake.admin.import:
    description: Reprendre les PNJ d'IslandNPC des îles qui n'ont pas encore de Jake (/shislandjake import).
    default: op
  shislandjake.admin.stats:
    description: Durée des tâches de Jake sur la dernière minute (/shislandjake stats).
    default: op
  shislandjake.admin.react:
    description: Faire réagir Jake pour un joueur (/shislandjake react <joueur> <réaction> [texte]).
    default: op
  shislandjake.admin.say:
    description: Faire dire une bulle à Jake pour un joueur (/shislandjake say <joueur> <texte>).
    default: op
