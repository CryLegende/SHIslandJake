# ============================================================================
#  SHIslandJake : messages du chat, textes au-dessus de Jake, répliques, menus
#  et noms des apparences
# ============================================================================
#  Codes couleur & et &#RRGGBB acceptés. Format SkyHand pour le chat : préfixe
#  de la couleur du type, texte en &7, mots importants dans la couleur du type.
#    &a succès · &e information · &6 avertissement · &c erreur
#  Un message vide n'est pas envoyé. {nom} = nom de Jake selon son apparence.
# ============================================================================

chat:
  pas-d-ile: '&7&l« &c&lSH &8&l» &7Vous devez avoir une &cîle &7pour parler à Jake (&c/is&7).'
  # Le Jake de l'île avait disparu : il revient à sa place de départ.
  jake-revenu: '&7&l« &e&lSH &8&l» &e{nom} &7n''était plus sur votre île, il vient d''y &erevenir&7.'
  pas-membre: '&7&l« &c&lSH &8&l» &7Vous devez faire partie de &ccette île &7pour parler à {nom}.'
  visible: '&7&l« &a&lSH &8&l» &a{nom} &7est de nouveau &avisible &7par tout le monde.'
  cache: '&7&l« &a&lSH &8&l» &a{nom} &7se &acache &7maintenant de tout le monde.'
  # Jake discret pour ce joueur seul (ni bulle, ni geste, ni son), ou de nouveau bavard.
  discret: '&7&l« &a&lSH &8&l» &a{nom} &7reste maintenant &adiscret &7avec vous.'
  bavard: '&7&l« &a&lSH &8&l» &a{nom} &7vous &aparle &7de nouveau.'
  # {secondes} = temps laissé pour cliquer.
  deplacement-debut: '&7&l« &e&lSH &8&l» &7Cliquez sur un &ebloc de votre île &7pour y placer &e{nom} &7(&e{secondes} s&7).'
  deplacement-deja: '&7&l« &e&lSH &8&l» &7Cliquez sur un &ebloc de votre île &7pour y placer &e{nom}&7.'
  deplace: '&7&l« &a&lSH &8&l» &a{nom} &7a été &adéplacé&7.'
  deplacement-temps: '&7&l« &6&lSH &8&l» &6Temps écoulé&7, {nom} n''a pas bougé.'
  deplacement-annule: '&7&l« &6&lSH &8&l» &7Déplacement de &6{nom} &7annulé.'
  deplacement-hors-ile: '&7&l« &c&lSH &8&l» &7Ce bloc n''est pas sur &cvotre île&7.'
  deplacement-place: '&7&l« &c&lSH &8&l» &7Il n''y a pas assez de &cplace &7au-dessus de ce bloc.'
  # {type} = nom de l'apparence.
  type-change: '&7&l« &a&lSH &8&l» &7Jake est maintenant &a{type}&7.'
  type-deja: '&7&l« &e&lSH &8&l» &7Jake est déjà &e{type}&7.'
  # Apparence obtenue mais réservée à d'autres grades (ou, sans apparences.permission-usage, droit manquant).
  type-reserve: '&7&l« &c&lSH &8&l» &7L''apparence &c{type} &7est réservée aux grades &cVIP&7.'
  # Apparence pas encore obtenue (avec apparences.permission-usage).
  type-non-obtenue: '&7&l« &c&lSH &8&l» &7Vous n''avez pas encore obtenu l''apparence &c{type}&7.'
  type-inconnu: '&7&l« &c&lSH &8&l» &7Il n''existe pas d''apparence &c{type}&7.'
  # Apparence remplacée par une autre (config.yml, apparences.remplacements) : elle n'est plus proposée.
  type-remplace: '&7&l« &c&lSH &8&l» &7L''apparence &c{type} &7n''est plus proposée.'
  sans-permission: '&7&l« &c&lSH &8&l» &7Vous n''avez pas la &cpermission &7d''utiliser cette commande.'
  joueurs-seulement: '&7&l« &c&lSH &8&l» &7Cette commande se lance &cen jeu&7.'
  # {commandes} = sous-commandes permises, séparées par « | ».
  utilisation: '&7&l« &e&lSH &8&l» &7Tapez &e/jake {commandes}&7.'
  utilisation-admin: '&7&l« &e&lSH &8&l» &7Tapez &e/shislandjake {commandes}&7.'
  # {reactions} = nombre de réactions lues.
  recharge: '&7&l« &a&lSH &8&l» &7Configuration &arechargée &7({reactions} réactions).'
  # {fichier} = fichier refusé ; l'ancienne configuration reste en place.
  recharge-erreur: '&7&l« &c&lSH &8&l» &c{fichier} &7est invalide : l''ancienne configuration reste en place (voir la console).'
  # /shislandjake react avec un nom de réaction absent de config.yml (reactions). {reaction} = nom donné.
  reaction-inconnue: '&7&l« &c&lSH &8&l» &7Il n''existe pas de réaction &c{reaction} &7(config.yml, reactions).'
  # {jakes} = Jake enregistrés, {caches} = Jake cachés, {dessines} = Jake dessinés en ce moment.
  info: '&7&l« &e&lSH &8&l» &e{jakes} Jake &7({caches} cachés), &e{dessines} &7dessinés en ce moment.'
  # {joueur}, {type}, {monde}, {x}, {y}, {z}, {visible}, {corps} (texte de « corps »).
  info-joueur: '&7&l« &e&lSH &8&l» &7Jake de l''île de &e{joueur} &7: &e{type} &7en &e{monde} {x} {y} {z}&7, {visible}&7, {corps}&7.'
  info-sans-jake: '&7&l« &e&lSH &8&l» &7L''île de &e{joueur} &7n''a pas de Jake.'
  joueur-sans-ile: '&7&l« &c&lSH &8&l» &c{joueur} &7n''a pas d''île.'
  aucune-ile-ici: '&7&l« &c&lSH &8&l» &7Vous n''êtes sur &caucune île&7.'
  supprime: '&7&l« &a&lSH &8&l» &7Jake de l''île &aretiré&7 ; il reviendra au prochain &a/jake &7d''un membre.'
  # {importes} = Jake repris, {presents} = îles qui avaient déjà leur Jake.
  import: '&7&l« &a&lSH &8&l» &7IslandNPC : &a{importes} Jake repris&7, {presents} îles avaient déjà le leur.'
  import-absent: '&7&l« &c&lSH &8&l» &7Aucune base &cIslandNPC &7à reprendre (plugins/IslandNPC/database.db).'
  import-erreur: '&7&l« &c&lSH &8&l» &7La base &cIslandNPC &7n''a pas pu être lue (voir la console).'
  # /shislandjake stats. {fenetre} = secondes mesurées (60 au plus), {joueurs} = joueurs en ligne.
  stats-entete: '&7&l« &e&lSH &8&l» &7Jake sur les &e{fenetre} s &7dernières, &e{joueurs} &7joueurs en ligne :'
  # {tache} ; {passages} ; {moyenne} et {max} en µs par passage ; {par-tick} en µs par tick ; {par-joueur} en µs par
  # joueur en ligne et par tick.
  stats-ligne: '&8 • &e{tache} &7: {passages} passages, moyenne &e{moyenne} µs&7, max &e{max} µs&7, &e{par-tick} µs&7/tick, &e{par-joueur} µs&7/joueur/tick'
  # {dessines} = Jake dessinés en ce moment, {suivis} = joueurs qui ont un Jake près d'eux.
  stats-pied: '&8 • &7Jake dessinés : &e{dessines}&7, joueurs suivis : &e{suivis}&7.'

# Noms des sous-commandes affichés dans les lignes d'utilisation.
sous-commandes:
  reglages: reglages
  deplacer: deplacer
  visibilite: visibilite
  type: type
  discret: discret
  react: react <joueur> <réaction> [texte]
  say: say <joueur> <texte>

# Noms des tâches dans /shislandjake stats.
stats:
  suivi: Suivi des joueurs
  regard: Regard de Jake
  reactions: Réactions
  bulles: Bulles

# Ce qui dessine un Jake, dans /shislandjake info <joueur>. {apparence} = apparence dessinée.
corps:
  aucun: '&7pas dessiné en ce moment'
  modele: '&7modèle &e{apparence}'
  mob: '&7corps de secours &e{apparence}'

# Texte de %shislandjake_visible% et de {visible} dans info-joueur, et de %shislandjake_discret%.
placeholders:
  visible: '&avisible'
  cache: '&ccaché'
  discret-oui: oui
  discret-non: non

# Nom au-dessus de Jake. {nom} = nom de Jake selon son apparence.
hologramme:
  - '&b&l{nom}'
  - '&7(clic droit)'

# Ligne d'alerte au-dessus du nom (config.yml, alerte), montrée seulement au membre concerné. Les placeholders
# sont lus pour lui ; une ligne vide n'est pas montrée.
alerte:
  - '&e&l!'

# Bulle de Jake quand il parle à un joueur. {texte} = la réplique, écrite mot par mot.
bulle:
  format: '&f{texte}'

# Répliques des réactions (config.yml, reactions.<réaction>.repliques) : repliques.<caractère>.<liste>, sinon
# repliques.defaut.<liste>. Le caractère vient de l'apparence (types.<ID>.caractere). Une ligne au hasard, jamais deux
# fois de suite la même pour un joueur. {joueur} = le joueur, {nom} = nom de Jake, {chef} = chef de l'île ; les
# placeholders sont lus pour le joueur.
repliques:
  defaut:
    bonjour:
      - 'Bonjour {joueur} !'
      - 'Ah, vous revoilà {joueur}.'
      - 'Content de vous revoir sur l''île.'
    visiteur:
      - 'Bienvenue sur l''île de {chef} !'
      - 'Bonjour ! Vous êtes chez {chef} ici.'
    joie:
      - 'Bravo, {joueur} !'
      - 'Magnifique !'

# Nom de chaque apparence dans les menus et les messages, et nom de Jake sous cette apparence.
# Une apparence sans « jake » garde le nom par défaut.
types:
  defaut-jake: Jake
  VILLAGER:
    nom: Villageois
  EVOKER:
    nom: Évocateur
  PILLAGER:
    nom: Pillard
  VINDICATOR:
    nom: Vindicateur
  WANDERING_TRADER:
    nom: Marchand
  WITCH:
    nom: Sorcière
    jake: Jakie

menu:
  principal:
    titre: '&8&l{nom} &8| Réglages'
    jake:
      nom: '&e{nom}, votre guide'
      description:
        - ''
        - '&8&l« &fRéglez-moi comme vous voulez ! &8&l»'
    type:
      nom: '&dApparence de {nom}'
      # {types} = une ligne par apparence (ligne, ligne-actuel), {reserve} = ligne
      # « reserve » quand le joueur ne peut utiliser aucune autre apparence.
      description:
        - ''
        - '&8&l« &7Choisissez à quoi ressemble {nom}. &8&l»'
        - ''
        - '{types}'
        - '{reserve}'
        - ''
        - '&7&o(( &d&oCliquez pour choisir &7&o))'
      ligne: ' &8• &7{type}'
      ligne-actuel: ' &d✔ &f{type}'
      reserve: ' &8✘ &7Les autres sont réservées aux grades &dVIP&7.'
    visibilite:
      nom: '&aVisibilité de {nom}'
      # {etat} = etat-visible ou etat-cache, {action} = action-visible ou action-cache.
      description:
        - ''
        - '&8&l« &7Montrez {nom} à tout le monde,'
        - '&7ou à personne. &8&l»'
        - ''
        - ' {etat}'
        - ''
        - '&7&o(( &a&oCliquez pour {action} &7&o))'
      etat-visible: '&a• &7Tout le monde voit &a{nom}'
      etat-cache: '&c• &7Personne ne voit &c{nom}'
      action-visible: 'cacher {nom}'
      action-cache: 'montrer {nom}'
    position:
      nom: '&6Position de {nom}'
      description:
        - ''
        - '&8&l« &7Cliquez ici, puis sur le bloc de'
        - '&7votre île où vous voulez {nom}. &8&l»'
        - ''
        - '&7&o(( &6&oCliquez pour choisir le bloc &7&o))'
    discret:
      nom: '&bParole de {nom}'
      # {etat} = etat-discret ou etat-bavard, {action} = action-discret ou action-bavard. Ce réglage ne vaut que
      # pour le joueur, sur toutes les îles.
      description:
        - ''
        - '&8&l« &7Je peux vous parler quand vous'
        - '&7passez, ou rester discret. &8&l»'
        - ''
        - ' {etat}'
        - ''
        - '&7&o(( &b&oCliquez pour {action} &7&o))'
      etat-bavard: '&a• &7{nom} vous &aparle'
      etat-discret: '&8• &7{nom} reste &8discret'
      action-bavard: 'rendre {nom} discret'
      action-discret: 'que {nom} vous parle'
    retour:
      nom: '&c⤾ Retour &7(Clic)'
  types:
    titre: '&8&l{nom} &8| Apparence'
    # {type} = nom de l'apparence, {jake} = nom de Jake sous cette apparence.
    jake:
      nom: '&e{nom}, votre guide'
      description:
        - ''
        - '&8&l« &fÀ quoi voulez-vous que je ressemble ? &8&l»'
    type:
      nom: '&d{type}'
      actuel:
        - ''
        - ' &d✔ &7C''est {jake} en ce moment'
      disponible:
        - ''
        - '&8&l« &7{jake} prend cette apparence. &8&l»'
        - ''
        - '&7&o(( &d&oCliquez pour choisir &7&o))'
      # Pas encore obtenue (avec apparences.permission-usage).
      non-obtenue:
        - ''
        - ' &c✘ &7Pas encore obtenue'
      # Obtenue, mais réservée à d'autres grades (sans permission-usage : droit de l'apparence manquant).
      reserve:
        - ''
        - ' &c✘ &7Réservée aux grades &dVIP'
    retour:
      nom: '&c⤾ Retour &7(Clic)'

# Aide de /is pour la sous-commande « jake ».
sous-commande-ile:
  description: Ouvrir Jake, le PNJ de votre île.
