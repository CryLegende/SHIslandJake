# ============================================================================
#  SHIslandJake : Jake, le PNJ de chaque île
# ============================================================================
#
#  Chaque île SuperiorSkyblock2 a son Jake, posé près du centre à la création
#  de l'île. Un clic sur Jake (membre de l'île) lance la commande « clic ».
#  Accroupi + clic : les réglages de Jake.
#
#  Jake parle et réagit à ce que fait le joueur : à son arrivée près de Jake,
#  ou quand un autre plugin le demande (/shislandjake react). Une réaction est
#  vue par le seul joueur concerné : un geste du modèle, une réplique dans une
#  bulle au-dessus de Jake, un son, des particules (voir « reactions »).
#
#  Un personnage dessiné par un modèle vit aussi pour le joueur proche qui l'a
#  devant lui (« ambiance ») : il respire et bouge un peu sans arrêt (« vie »),
#  et joue de temps en temps une courte scène quand rien d'autre ne se passe
#  pour lui.
#
#  Le corps de Jake vient de son apparence (« types ») : un modèle de
#  BlockDisplayCreator (« modele ») ou, en secours, un mob dessiné par
#  FancyNpcs (« mob »). Si le modèle manque (BlockDisplayCreator absent,
#  fichier introuvable), Jake est dessiné avec l'apparence
#  « apparences.secours » : il n'y a jamais d'île sans Jake.
#
#  Le plugin garde lui-même ses Jake (jakes.yml) ; ils ne sont dessinés que là
#  où un joueur passe. Le nom au-dessus de Jake, l'alerte et les bulles sont
#  envoyés en paquets (packetevents) : chaque joueur reçoit les siens.
#  Ils descendent sous un feuillage ou un plafond qui occuperait leur place
#  (hologramme.sous-les-blocs), et une espace devant « ! ? : ; » ou derrière
#  « y devient insécable à l'affichage : les fichiers gardent des espaces
#  normales.
#
#  Au premier démarrage, les PNJ d'IslandNPC (plugins/IslandNPC/database.db)
#  sont repris : position, type et visibilité de chaque île.
#
#  Guide du staff (ajouter un personnage, une réaction ou une réplique, faire
#  réagir Jake depuis un autre plugin, faire passer toutes les îles à un autre
#  personnage) : LISEZ-MOI.txt, posé à côté de ce fichier.
#
#  Commandes joueur (alias /jack, /islandnpc, /isnpc, et /is jake, /is npc)
#    /jake                      ouvre les réglages de Jake (ou lance jake-sans-argument.commande)
#    /jake reglages [origine]   ouvre les réglages de Jake
#    /jake deplacer             clic sur un bloc de son île pour y placer Jake
#    /jake visibilite           cache ou montre Jake à tout le monde
#    /jake type [apparence]     choisit l'apparence de Jake (menu sans argument)
#    /jake discret              Jake discret pour soi : ni bulle, ni geste, ni son
#    /jake <autre chose>        lance jake-argument-inconnu.commande
#
#  Commandes d'administration (console aussi)
#    /shislandjake reload           recharge config.yml (réactions comprises)
#                                   et messages.yml ; un fichier invalide est
#                                   refusé et nommé
#    /shislandjake info [joueur]    nombre de Jake, ou le Jake de l'île du joueur
#    /shislandjake delete [joueur]  retire le Jake de l'île où l'on se trouve (ou
#                                   de l'île du joueur) ; il revient à sa place de
#                                   départ au prochain /jake d'un membre
#    /shislandjake import           reprend les PNJ d'IslandNPC des îles qui
#                                   n'ont pas encore de Jake
#    /shislandjake stats            durée des tâches de Jake sur la dernière minute
#                                   (le temps des réactions d'approche et des scènes
#                                   d'ambiance est compté aussi dans « suivi » ; « vie »
#                                   = les animations de vie enchaînées)
#    /shislandjake react <joueur> <réaction> [texte]
#                                   joue une réaction pour ce joueur (le texte
#                                   remplace la réplique) ; ne répond rien, qu'elle
#                                   joue ou soit abandonnée (joueur loin de Jake...)
#    /shislandjake say <joueur> <texte>
#                                   Jake dit ce texte dans une bulle, à ce joueur
#                                   (codes couleur ; texte pris tel quel, l'appelant
#                                   lit ses placeholders ; {joueur}, {nom}, {chef})
#
#  Permissions
#    shislandjake.use             /jake, réglages, apparence, discret (tout le monde)
#    shislandjake.deplacer        déplacer Jake (tout le monde)
#    shislandjake.visibilite      cacher ou montrer Jake (tout le monde)
#    shislandjake.type.<type>     apparences de Jake (voir « types ») ; op par défaut
#    shislandjake.type.*          toutes les apparences de la configuration par défaut (op)
#    shislandjake.personnages     utiliser les apparences obtenues (apparences.permission-usage) :
#                                 à donner aux grades VIP et plus, jamais aux op d'office
#    shislandjake.bypass          cliquer sur le Jake de n'importe quelle île (op)
#    shislandjake.admin           toutes les sous-commandes de /shislandjake, bypass, type.* (op)
#    shislandjake.admin.<sous-commande>   reload, info, delete, import, stats, react, say
#
#  Placeholders
#    %shislandjake_type%          apparence du Jake de l'île du joueur (VILLAGER...)
#    %shislandjake_type_nom%      nom de l'apparence (messages.yml, types)
#    %shislandjake_nom%           nom de Jake selon son apparence (Jake, Jakie)
#    %shislandjake_visible%       visible ou caché (messages.yml, placeholders)
#    %shislandjake_discret%       oui si le joueur a rendu Jake discret (messages.yml, placeholders)
# ============================================================================

jake:
  # Apparence de Jake à la création d'une île ; doit figurer dans « types ».
  type: AVENTURIER
  # Jake visible à la création d'une île.
  visible: true
  # Crée Jake à la création d'une île. Sinon, il apparaît au premier /jake.
  creation-avec-ile: true
  # Place de départ par rapport au centre de l'île (x, y, z) et orientation
  # (yaw : 0 regarde vers le sud, 90 vers l'ouest, 180 vers le nord).
  position:
    x: 3.0
    y: 0.0
    z: 6.0
    yaw: 180.0
    pitch: 0.0

affichage:
  # Distance, en blocs, à laquelle un joueur voit Jake.
  distance: 32
  # Ticks entre deux vérifications des Jake proches de chaque joueur.
  intervalle-ticks: 10
  # Un joueur qui n'a pas bougé de plus de ce nombre de blocs depuis sa dernière vérification, pour qui aucun Jake n'a
  # changé et dont l'alerte n'est pas à relire est sauté (seule son ambiance est regardée).
  mouvement-minimum: 0.25
  # Vérification complète au moins toutes ces secondes, même pour un joueur immobile.
  passage-complet-secondes: 5
  # Secondes entre deux lectures de l'appartenance du joueur à l'île du Jake (membre exclu ou invité).
  verification-membre-secondes: 10
  # Secondes entre deux questions au moteur sur un modèle montré (toujours là ?) ; il est aussi interrogé quand un
  # joueur arrive en vue du Jake.
  verification-modele-secondes: 5
  # Un Jake qu'aucun joueur n'a vu depuis ce nombre de minutes n'est plus
  # dessiné ; il revient avec le prochain joueur.
  oubli-minutes: 10
  # Corps de secours (mob) : Jake se tourne vers le joueur qui s'approche
  # (tête, corps, inclinaison) et reprend son orientation d'origine quand le
  # joueur s'éloigne. Un modèle regarde selon son propre fichier.
  regarder-joueurs: true
  # Distance, en blocs, à laquelle Jake regarde un joueur.
  distance-regard: 6
  # Ticks entre deux mises à jour du regard de Jake pour un joueur proche.
  # Seuls les Jake à moins de distance-regard + 4 blocs d'un joueur sont suivis.
  intervalle-regard-ticks: 2
  # Vitesse de rotation maximale de Jake, en degrés par seconde. 0 = d'un coup.
  vitesse-regard: 180
  # Angle minimal, en degrés, dont le regard doit changer pour qu'une mise à
  # jour soit envoyée au joueur.
  angle-regard-minimum: 2.0
  # Inclinaison maximale de la tête de Jake, vers le haut comme vers le bas,
  # en degrés.
  inclinaison-regard-max: 40
  # Contour lumineux autour du corps de secours, et sa couleur : BLACK,
  # DARK_BLUE, DARK_GREEN, DARK_AQUA, DARK_RED, DARK_PURPLE, GOLD, GRAY,
  # DARK_GRAY, BLUE, GREEN, AQUA, RED, LIGHT_PURPLE, YELLOW, WHITE.
  brillance: false
  couleur-brillance: BLUE

hologramme:
  # Nom au-dessus de Jake (lignes dans messages.yml, hologramme).
  active: true
  # Orientation du nom, de l'alerte et des bulles : VERTICAL (debout, tourne
  # vers le joueur), CENTER (suit aussi l'inclinaison du regard) ou FIXED.
  orientation: VERTICAL
  # Fond du nom et de l'alerte : transparent, default (fond gris de
  # Minecraft) ou #AARRGGBB.
  fond: transparent
  ombre-texte: true
  # Largeur maximale d'une ligne, en pixels, avant le retour à la ligne.
  largeur-ligne: 200
  # Hauteur, en blocs, du bas du nom au-dessus des pieds de Jake, pour une
  # apparence sans « hauteur ».
  hauteur: 2.1
  # Quand un bloc non traversable (feuillage, plafond) occupe la place des textes au-dessus de Jake (nom, alerte,
  # bulle), les textes descendent pour tenir dessous (leur haut 0,1 bloc sous le bloc), sans passer sous
  # « hauteur-minimale » (bas du nom au-dessus des pieds) ; sans la place, ils restent à leur hauteur normale.
  # « place-paroles » : hauteur gardée pour l'alerte ou la bulle au-dessus du décalage d'alerte. Les blocs sont relus
  # au dessin de Jake, puis toutes les « verification-secondes » quand quelqu'un le voit (un arbre pousse, on construit).
  sous-les-blocs:
    actif: true
    hauteur-minimale: 1.6
    place-paroles: 0.4
    verification-secondes: 30

bulle:
  # Bulle de Jake quand il parle à un joueur, au-dessus du nom (à la place de
  # l'alerte le temps de la réplique). Format du texte dans messages.yml (bulle).
  # Fond : transparent, default ou #AARRGGBB.
  fond: transparent
  largeur-ligne: 150
  # Ticks entre deux mots écrits. 0 = toute la réplique d'un coup.
  ticks-par-mot: 2
  # Une fois écrite, la bulle reste duree-base-secondes + duree-par-caractere
  # secondes par caractère de la réplique, puis disparaît.
  duree-base-secondes: 2.5
  duree-par-caractere: 0.06
  # Ticks pour apparaître en grossissant et disparaître en rétrécissant. 0 = d'un coup.
  apparition-ticks: 3

clic:
  # Commande lancée par le joueur qui clique sur Jake. Vide = aucune.
  commande: is
  # Le clic gauche compte aussi (les joueurs Bedrock tapent sur Jake).
  clic-gauche: true
  # Accroupi + clic : réglages de Jake au lieu de la commande.
  accroupi-ouvre-menu: true
  # Les membres de l'île peuvent cliquer sur Jake, pas seulement le chef.
  membres: true
  # Délai minimal, en millisecondes, entre deux clics pris en compte.
  delai-ms: 500
  # Animation du modèle jouée pour le joueur qui clique (si le modèle l'a), en
  # même temps que la commande. Vide = aucune.
  animation: clic

# /jake sans argument : commande lancée par le joueur à la place des réglages de Jake. Vide = les réglages.
# Les réglages restent sur /jake reglages et sur Accroupi + clic.
jake-sans-argument:
  commande: ""

# /jake avec un argument que le plugin ne connaît pas (/jake xyz) : commande lancée par le joueur, {arguments} = ce qu'il
# a tapé. Vide = la liste des commandes. « suggestions » s'ajoute à la touche Tab.
jake-argument-inconnu:
  commande: ""
  suggestions:

alerte:
  # Ligne au-dessus du nom de Jake (messages.yml, alerte), montrée à un membre de l'île seulement, quand le
  # placeholder vaut « valeur » pour lui. Ses lignes peuvent contenir des placeholders, lus pour ce joueur. Demande
  # PlaceholderAPI.
  actif: false
  placeholder: "%player_name%"
  valeur: "oui"
  # Hauteur, en blocs, au-dessus du bas du nom (l'alerte et les bulles).
  decalage: 0.6
  # Intervalle, en ticks, entre deux lectures des placeholders pour un même joueur.
  verification-ticks: 20

# Réactions de Jake, jouées pour le seul joueur concerné. Une réaction se lance :
#  - par commande, pour un joueur : /shislandjake react <joueur> <réaction> [texte] (d'autres plugins, menus...) ;
#  - et, avec « approche: true », quand le joueur arrive à moins de « distance » blocs du Jake près duquel il se
#    trouve (passage de dehors à dedans, avec 1 bloc de marge : un joueur qui reste près ne la relance pas). La
#    réaction d'approche possible de plus haute priorité gagne ; une seule par arrivée.
# Une réaction est abandonnée sans message si le joueur n'est pas près d'un Jake qu'il voit (« portee-commande »),
# si elle n'est pas pour lui (« pour »), en pause, ou si une condition est fausse. Si le joueur a un menu ouvert, elle
# attend sa fermeture (« attente-menu-secondes » au plus, une seule en attente : la dernière demandée). Un joueur qui a
# rendu Jake discret (/jake discret) ne reçoit ni bulle, ni geste, ni son, ni particules.
#
# Clés d'une réaction (toutes facultatives) :
#   approche        true : se lance aussi à l'arrivée du joueur près de Jake
#   si              conditions lues pour le joueur, toutes vraies : « %placeholder% >= 1 », « == oui », « != / »,
#                   « ~ expression régulière » (>, <, >=, <= comparent des nombres ; ==, != des nombres ou du texte)
#   pour            membres (défaut), visiteurs ou tous
#   animation       animation du modèle jouée pour ce joueur (ignorée par un corps qui ne l'a pas)
#   repliques       nom d'une liste de messages.yml (repliques.<caractère>.<liste>, sinon repliques.defaut.<liste>) ;
#                   une ligne tirée au hasard, jamais deux fois de suite la même ; ses placeholders sont lus pour
#                   le joueur, puis {joueur}, {nom} (de Jake) et {chef} (de l'île) remplacés
#   son, volume, pitch   son joué au joueur, à la place de Jake (nom en minuscules : entity.villager.yes) ; vide =
#                   types.<apparence>.sons.<réaction>, sinon aucun. Un son n'est joué qu'avec un geste, une bulle ou
#                   des particules.
#   particules      « NOM nombre » (HAPPY_VILLAGER 8), envoyées à ce joueur seul, autour de Jake ; une particule qui
#                   demande des données (couleur, bloc) est refusée au chargement
#   pause-secondes  délai avant de pouvoir rejouer pour ce joueur (en mémoire, remis à zéro au redémarrage)
#   priorite        à l'arrivée, la réaction possible de plus haute priorité gagne (défaut 0)
reactions:
  # Distance, en blocs, de l'arrivée près de Jake.
  distance: 6
  # Distance, en blocs, à laquelle une réaction demandée par commande se joue ; plus loin, elle est abandonnée.
  portee-commande: 16
  # Secondes pendant lesquelles une réaction attend la fermeture du menu ouvert du joueur.
  attente-menu-secondes: 30
  # Ticks sans menu rouvert après une fermeture avant que la réaction parte.
  menu-ferme-ticks: 3
  # Hauteur du son au-dessus des pieds de Jake, en blocs.
  son-hauteur: 1.0
  # Particules des réactions : écart horizontal et vertical autour de Jake (blocs), vitesse, et hauteur du nuage
  # (part de la hauteur du nom : 0.5 = à mi-hauteur).
  particules:
    ecart: 0.4
    ecart-vertical: 0.5
    vitesse: 0.02
    hauteur: 0.55
  bonjour:
    approche: true
    priorite: 0
    pause-secondes: 900
    animation: coucou
    repliques: bonjour
  visiteur:
    approche: true
    pour: visiteurs
    pause-secondes: 900
    animation: coucou
    repliques: visiteur
  joie:
    animation: joie
    repliques: joie
    son: entity.villager.celebrate
    particules: HAPPY_VILLAGER 8

deplacement:
  # Secondes laissées au joueur pour cliquer sur le bloc où placer Jake.
  # Jake se pose sur le bloc cliqué, sur l'île du joueur, et se tourne vers lui.
  temps-secondes: 15

# Sous-commandes de /is qui font comme /jake (/is jake, /is jake reglages). Prises en compte au démarrage seulement.
sous-commandes-ile:
  - jake
  - npc

apparences:
  # Apparence « mob » dessinée à la place d'un modèle introuvable (BlockDisplayCreator absent, fichier manquant), avec
  # un avertissement en console par apparence. Nommée ici, elle n'est jamais proposée aux joueurs, et un Jake qui l'a
  # (ou dont l'apparence n'est plus dans « types ») est dessiné avec jake.type. Vide = la première apparence « mob »
  # de « types », proposée comme les autres.
  secours: VILLAGER
  # Droit exigé pour utiliser une apparence qui s'obtient (types.<ID>.obtention ou types.<ID>.permission) : elles
  # s'obtiennent en jouant, mais ne s'utilisent qu'avec ce droit, donné aux grades VIP et plus (shislandjake.personnages
  # n'est pas donné aux op d'office). Une apparence sans obtention est à tout le monde. Vérifié au moment du choix ;
  # une apparence déjà choisie n'est jamais retirée. Vide = l'obtention suffit.
  permission-usage: shislandjake.personnages
  # Ancien identifiant → nouveau, appliqué aux Jake de jakes.yml au démarrage et au rechargement : fait passer toutes
  # les îles d'une apparence à une autre ; l'ancienne n'est plus proposée. L'apparence de secours peut être remplacée :
  # elle reste dans « types » pour dessiner Jake quand un modèle manque, sans être proposée.
  # Le jour où le modèle JAKE_aventurier est en production : décommentez les six lignes ci-dessous et rechargez.
  # (Avant cela, un Jake de ces apparences est déjà dessiné en Aventurier, mais jakes.yml garde l'ancien nom.)
  remplacements:
  #  VILLAGER: AVENTURIER
  #  EVOKER: AVENTURIER
  #  PILLAGER: AVENTURIER
  #  VINDICATOR: AVENTURIER
  #  WANDERING_TRADER: AVENTURIER
  #  WITCH: AVENTURIER
  # Zone cliquable d'un modèle quand ni son apparence (zone-clic) ni son dessin ne la donnent, en blocs ; largeur-max
  # borne la largeur prise d'après le dessin (un objet tenu à bout de bras ne l'élargit pas trop).
  zone-clic:
    largeur: 1.0
    hauteur: 2.0
    largeur-max: 1.5
  # Marge, en blocs, entre le haut du dessin d'un modèle et le bas du nom (apparence sans « hauteur »).
  marge-texte: 0.25
  # Un Jake dessiné en secours parce que son modèle manquait réessaie le modèle toutes ces secondes.
  reessai-modele-secondes: 60

# Scènes d'ambiance : courtes animations du modèle (types.<apparence>.scenes, animations « trigger: command » de son
# fichier), jouées pour un joueur seul quand il est à moins de « distance » blocs d'un Jake dessiné par un modèle, qu'il
# a Jake devant lui (« angle-vue » degrés au plus entre son regard et Jake), qu'il n'est pas discret, et que rien ne se
# passe pour lui (bulle, réaction en cours ou en attente, pause). Une scène au hasard, jamais deux fois de suite la
# même ; après chaque scène ou réaction, une pause tirée entre pause-min-secondes et pause-max-secondes. Une réaction
# passe devant une scène ; une scène n'interrompt rien. Pour les membres comme pour les visiteurs.
#
# Animations de vie (types.<apparence>.vie : respirer, petits mouvements, qui partent de la pose de repos et y
# reviennent) : tant que ce joueur a Jake devant lui, à moins de « distance » blocs, elles s'enchaînent pour lui sans
# trou, tirées au hasard (jamais deux fois de suite la même ; seule, elle se répète). Une scène ou le geste d'une
# réaction la remplace, la vie reprend à sa fin ; la pause entre deux scènes compte pendant la vie. Quand il se
# détourne ou s'éloigne, l'animation en cours finit et rien n'est relancé ; ça repart quand il regarde de nouveau Jake.
ambiance:
  actif: true
  distance: 10
  angle-vue: 70
  pause-min-secondes: 15
  pause-max-secondes: 30
  vie-actif: true
  # « Jake discret » (/jake discret) : la vie continue (true) ; jamais de scène ni de réaction pour lui.
  vie-si-discret: true
  # Durée d'une animation (scène ou réaction) quand le moteur ne la donne pas : « durees.<modèle>.<animation> » en
  # secondes (deux modèles peuvent avoir une animation du même nom), sinon celle-ci. Une scène absente du fichier du
  # modèle est signalée en console, une fois, et n'est pas jouée (de même pour une animation de vie).
  duree-defaut-secondes: 8
  durees:

# Apparences que les joueurs peuvent choisir, dans l'ordre des cartes du menu Apparence (/jake type). L'identifiant est
# libre (AVENTURIER, ARBRE...). Nom, phrase de caractère et texte d'obtention : messages.yml, types.<ID>. Comment
# ajouter un personnage : LISEZ-MOI.txt.
#   modele            nom d'un bloc de BlockDisplayCreator (custom-blocks) : Jake est ce modèle ; taille = son échelle
#   mob               sans « modele » : type Minecraft dessiné par FancyNpcs (VILLAGER, WITCH...) ; absent = l'identifiant
#   icone             objet de la carte : matériau, tête HeadDatabase (hdb-81626) ou tête texturée (basehead-<base64>)
#   hauteur           bas du nom au-dessus des pieds de Jake, en blocs ; absent pour un modèle = d'après son dessin
#   zone-clic         largeur et hauteur de la zone cliquable d'un modèle ; absente = d'après son dessin
#   caractere         jeu de répliques (messages.yml, repliques.<caractère>) ; absent = defaut
#   sons              son de chaque réaction pour cette apparence (quand la réaction n'a pas de « son »)
#   scenes            animations d'ambiance de ce modèle (voir « ambiance »)
#   vie               animations de vie de ce modèle, enchaînées sans arrêt pour le joueur qui regarde Jake
#   obtention         conditions lues pour le joueur (écrites comme les « si » des réactions), toutes vraies pour obtenir
#                     l'apparence ; lues au dessin du menu et au moment du choix. Absente = à tout le monde.
#   obtention-valeur  placeholder de la valeur qui avance (%shjobs_player_level_bucheron%) : la carte d'une apparence
#                     pas obtenue montre où en est le joueur, sur le nombre de la condition qui le compare (4 / 10)
#   permission        droit d'obtention, en plus des conditions ; vide = aucun
# Une apparence qui s'obtient (obtention ou permission) ne s'utilise qu'avec apparences.permission-usage.
types:
  AVENTURIER:
    modele: JAKE_aventurier
    taille: 1.0
    icone: FILLED_MAP
    zone-clic:
      largeur: 1.2
      hauteur: 2.4
    scenes:
      - carte
      - sac
      - somnole
    vie:
      - respire
      - respire2
  # Apparence de secours (apparences.secours) : jamais proposée, dessinée seulement à la place d'un modèle qui manque.
  VILLAGER:
    mob: VILLAGER
    icone: VILLAGER_SPAWN_EGG
    hauteur: 2.1
  # Personnages à venir. Décommentez un bloc le jour où son modèle est dans les blocs du moteur (custom-blocks), avec ses
  # scènes et sa vie, et ses lignes dans messages.yml (types.<ID>). Le niveau 10 est un réglage : le texte d'obtention
  # le reprend tout seul ({objectif}).
  #ARBRE:
  #  modele: JAKE_arbre
  #  icone: OAK_SAPLING
  #  caractere: arbre
  #  obtention:
  #    - "%shjobs_player_level_bucheron% >= 10"
  #  obtention-valeur: "%shjobs_player_level_bucheron%"
  #GOLEM:
  #  modele: JAKE_golem
  #  icone: IRON_BLOCK
